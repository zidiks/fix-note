# Production config for servers with existing Nginx Proxy Manager
# Uses non-conflicting ports: 8010 (backend), 3010 (frontend)

services:
  backend:
    build: ./backend
    container_name: voice-notes-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8010:8000"
    depends_on:
      - whisper
      - embeddings
      - qdrant
    networks:
      - voice-notes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: voice-notes-frontend
    restart: unless-stopped
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - voice-notes-net

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: voice-notes-whisper
    restart: unless-stopped
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    volumes:
      - whisper-models:/root/.cache/huggingface
    networks:
      - voice-notes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: voice-notes-embeddings
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDINGS_MODEL:-intfloat/multilingual-e5-base}"]
    environment:
      - HF_HOME=/data
    volumes:
      - tei-cache:/data
    networks:
      - voice-notes-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: voice-notes-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - voice-notes-net

networks:
  voice-notes-net:
    driver: bridge

volumes:
  whisper-models:
  tei-cache:
  qdrant-storage:












